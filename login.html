<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Área Administrativa</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#FDF1F0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:#fff;
width:100%;
max-width:450px;
padding:40px 30px;
border-radius:24px;
text-align:center;
border:1px solid #FDDFDD;
box-shadow:0 15px 40px rgba(123,20,30,.08);
}

.logo{
font-family:'Playfair Display',serif;
font-size:32px;
color:#7B141E;
margin-bottom:10px;
}

.subtitulo{
color:#666;
margin-bottom:30px;
}

.btn-google{
width:100%;
border:none;
cursor:pointer;
padding:15px;
border-radius:40px;
background:#fff;
border:1px solid #dadce0;
font-weight:600;
font-size:15px;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
transition:.3s;
}

.btn-google:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.loading{
display:none;
margin-top:20px;
color:#7B141E;
}

.erro{
display:none;
margin-top:20px;
color:#c62828;
font-size:14px;
}

.voltar{
display:inline-block;
margin-top:25px;
color:#7B141E;
text-decoration:none;
font-weight:600;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">
Mariana Jamilly
</div>

<p class="subtitulo">
Painel Administrativo
</p>

<button id="btnGoogleLogin" class="btn-google">

<svg width="18" height="18" viewBox="0 0 18 18">
<path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z" fill="#4285F4"/>
<path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
<path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
<path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
</svg>

Entrar com Google

</button>

<div id="loading" class="loading">
Verificando acesso...
</div>

<div id="erro" class="erro"></div>

<a href="index.html" class="voltar">
← Voltar ao site
</a>

</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDOOPrODo46x_VqXNUdvwq38wYK1TCkJXA",
    authDomain: "mariana-jamilly.firebaseapp.com",
    projectId: "mariana-jamilly",
    storageBucket: "mariana-jamilly.firebasestorage.app",
    messagingSenderId: "983935199953",
    appId: "1:983935199953:web:7b83c279b809056218b3f0"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const EMAILS_AUTORIZADOS = [
    "polyanadesn02@gmail.com",
    "polyanadesouzaneves2@gmail.com",
    "polyanadesouza02@gmail.com",
    "marianajamillynevesdeoliveira@gmail.com"
];

const btnGoogleLogin = document.getElementById("btnGoogleLogin");
const mensagemErro = document.getElementById("erro");

// Login
btnGoogleLogin.addEventListener("click", async () => {
    try {
        const provider = new firebase.auth.GoogleAuthProvider();

        await firebase.auth().setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );

        await firebase.auth().signInWithRedirect(provider);

    } catch (erro) {
        mensagemErro.innerText = erro.message;
        mensagemErro.style.display = "block";
    }
});

// Controle da sessão
firebase.auth().onAuthStateChanged((usuario) => {

    if (!usuario) return;

    const email = usuario.email.toLowerCase().trim();

    const autorizado = EMAILS_AUTORIZADOS.some(
        adm => adm.toLowerCase().trim() === email
    );

    if (autorizado) {
        window.location.replace("configuracoes.html");
    } else {
        firebase.auth().signOut();

        mensagemErro.innerText =
            "Este e-mail não possui permissão de administrador.";

        mensagemErro.style.display = "block";
    }
});
</script>

</body>
</html>
