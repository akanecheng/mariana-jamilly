<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="paginaTitulo">Poema - Mariana Jamilly</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FDF1F0;
            color: #4A4A4A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            width: 100%;
            flex: 1;
        }

        .btn-voltar {
            display: inline-block;
            margin-bottom: 30px;
            text-decoration: none;
            color: #7B141E;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .btn-voltar:hover {
            color: #D67F79;
        }

        .poema-container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(123, 20, 30, 0.05);
            border: 1px solid #EFD5D2;
            text-align: center;
        }

        .poema-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: #7B141E;
            margin-bottom: 30px;
        }

        .poema-texto {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            line-height: 2;
            color: #4A4A4A;
            white-space: pre-line;
            margin-bottom: 40px;
        }

        .poema-autor {
            font-style: italic;
            color: #D67F79;
            font-size: 15px;
            font-weight: 500;
        }

        footer {
            padding: 30px 0;
            text-align: center;
            border-top: 1px solid #FDDFDD;
        }

        @media (max-width: 600px) {
            .poema-container { padding: 30px 20px; }
            .poema-titulo { font-size: 28px; }
            .poema-texto { font-size: 16px; line-height: 1.8; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="poemas.html" class="btn-voltar">← Voltar para todos os poemas</a>

        <article class="poema-container">
            <h1 class="poema-titulo" id="poemaTitulo">Carregando...</h1>
            <div class="poema-texto" id="poemaTexto">Aguarde um instante enquanto buscamos os versos...</div>
            <div class="poema-autor" id="poemaAutor"></div>
        </article>
    </div>

    <footer>
        <p style="font-size: 12px; opacity: 0.6;">&copy; 2026 Mariana Jamilly. Todos os direitos reservados.</p>
    </footer>

    <!-- Firebase SDK Compat Core e Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCEggZoP5vk1JENjO8701pAFdBIBPB8gPQ",
            authDomain: "somos-mulheres-em-movimento.firebaseapp.com",
            projectId: "somos-mulheres-em-movimento",
            storageBucket: "somos-mulheres-em-movimento.firebasestorage.app",
            messagingSenderId: "427525655209",
            appId: "1:427525655209:web:cc00a592936dbd3df9f7b8"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();

        async function carregarPoema() {
            const urlParams = new URLSearchParams(window.location.search);
            const poemaId = urlParams.get('id');

            const tituloEl = document.getElementById('poemaTitulo');
            const textoEl = document.getElementById('poemaTexto');
            const autorEl = document.getElementById('poemaAutor');

            if (!poemaId) {
                tituloEl.innerText = "Poema não encontrado";
                textoEl.innerText = "Nenhum poema foi selecionado na página anterior.";
                return;
            }

            try {
                const doc = await db.collection("poemas").doc(poemaId).get();

                if (doc.exists) {
                    const poema = doc.data();
                    document.getElementById('paginaTitulo').innerText = `${poema.titulo || 'Poema'} - Mariana Jamilly`;
                    tituloEl.innerText = poema.titulo || 'Sem título';
                    textoEl.innerText = poema.texto || '';
                    autorEl.innerText = `— ${poema.assinatura || 'Mariana Jamilly'}`;
                } else {
                    tituloEl.innerText = "Poema não encontrado";
                    textoEl.innerText = "Este poema não está disponível ou foi removido.";
                }
            } catch (erro) {
                console.error("Erro ao buscar poema:", erro);
                tituloEl.innerText = "Erro ao carregar";
                textoEl.innerText = "Ocorreu um erro ao buscar o poema. Tente novamente mais tarde.";
            }
        }

        document.addEventListener('DOMContentLoaded', carregarPoema);
    </script>
</body>
</html>
