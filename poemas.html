<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poemas - Mariana Virtudes</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FDF1F0;
            color: #4A4A4A;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }

        .poemas-header {
            text-align: center;
            padding: 40px 0;
        }

        .poemas-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            color: #7B141E;
            margin-bottom: 10px;
        }

        .poemas-header p {
            font-style: italic;
            color: #D67F79;
            max-width: 650px;
            margin: 0 auto;
            padding: 0 10px;
            line-height: 1.8;
        }

        .poemas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .card-poema {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(123, 20, 30, 0.05);
            transition: 0.3s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid transparent;
            height: 100%;
        }

        .card-poema:hover {
            transform: translateY(-5px);
            border-color: #FDDFDD;
            box-shadow: 0 10px 25px rgba(123, 20, 30, 0.1);
        }

        .card-poema h3 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: #7B141E;
            margin-bottom: 15px;
        }

        .card-poema p {
            font-size: 14px;
            line-height: 1.6;
            color: #666;
            flex-grow: 1;
            margin-bottom: 20px;
        }

        .ler-mais {
            font-size: 13px;
            font-weight: 600;
            color: #D67F79;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-voltar {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #7B141E;
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .poemas-header h1 { font-size: clamp(2rem, 5vw, 42px); }
            .container { padding: 20px 18px; }
            .card-poema { padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="poemas-header">
            <a href="index.html" class="btn-voltar">← Voltar para o Início</a>
            <h1>Poesias e Florescimentos</h1>
            <p>"Para além do movimento, cultivo o silêncio. Aqui compartilho versos sobre a vida, a fé e os detalhes que os olhos comuns não veem."</p>
        </header>

        <div class="poemas-grid" id="listaPoemas">
            <p style="text-align: center; color: #777; grid-column: 1/-1;">Carregando poemas...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCEggZoP5vk1JENjO8701pAFdBIBPB8gPQ",
            authDomain: "somos-mulheres-em-movimento.firebaseapp.com",
            projectId: "somos-mulheres-em-movimento",
            storageBucket: "somos-mulheres-em-movimento.firebasestorage.app",
            messagingSenderId: "427525655209",
            appId: "1:427525655209:web:cc00a592936dbd3df9f7b8"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        function renderizarPoemasNaLista() {
            const container = document.getElementById('listaPoemas');
            const db = firebase.firestore();

            db.collection("poemas").orderBy("criadoEm", "desc").onSnapshot((snapshot) => {
                container.innerHTML = '';
                if (snapshot.empty) {
                    container.innerHTML = '<p style="text-align: center; color: #777; grid-column: 1/-1;">Nenhum poema publicado ainda.</p>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const poema = doc.data();
                    const linhas = (poema.texto || '').split('\n');
                    const primeiraLinha = linhas[0] || '';
                    const segundaLinha = linhas[1] || '';

                    const card = document.createElement('a');
                    card.className = 'card-poema';
                    card.href = `poema1.html?id=${doc.id}`;
                    card.innerHTML = `
                        <h3>${poema.titulo || 'Sem título'}</h3>
                        <p>"${primeiraLinha}<br>${segundaLinha}..."</p>
                        <span class="ler-mais">Ler Poema Completo →</span>
                    `;
                    container.appendChild(card);
                });
            }, (erro) => {
                console.error("Erro ao carregar poemas da lista:", erro);
            });
        }

        document.addEventListener('DOMContentLoaded', renderizarPoemasNaLista);
    </script>
</body>
</html>
